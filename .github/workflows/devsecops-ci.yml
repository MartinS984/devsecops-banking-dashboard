name: DevSecOps-CI-Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Grant the workflow permission to write to the Security Tab
permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SCA: Scan for vulnerabilities in dependencies
      - name: Run Trivy FS Scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' 
          severity: 'HIGH,CRITICAL'

      # IaC: Scan Terraform/K8s for misconfigurations
      - name: Run Trivy Config Scan (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # Upload results to GitHub Security Dashboard
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Upload even if the scan failed
        with:
          sarif_file: 'trivy-results.sarif'

  sonarcloud:
    name: SonarCloud Analysis (SAST)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}